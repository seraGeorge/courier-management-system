services:
  logistics_db:
    image: postgres:16
    container_name: logistics_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: logistics_db
    ports:
      - "5433:5432"
    volumes:
      - logistics_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - logistics_network

  logistics_backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: logistics_backend
    restart: unless-stopped
    ports:
      - "5001:5001"
    env_file:
      - ./backend/.env
    depends_on:
      logistics_db:
        condition: service_healthy
    networks:
      - logistics_network

  logistics_frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5001/api
        NEXT_PUBLIC_STAFF_API_KEY: ${NEXT_PUBLIC_STAFF_API_KEY:-}
        NEXT_PUBLIC_STAFF_SECRET_KEY: ${NEXT_PUBLIC_STAFF_SECRET_KEY:-}
    container_name: logistics_frontend
    restart: unless-stopped
    ports:
      - "3001:3000"
    depends_on:
      - logistics_backend
    networks:
      - logistics_network

  redis:
    image: redis:7-alpine
    container_name: logistics_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - logistics_network

volumes:
  logistics_db_data:

networks:
  logistics_network:
    external: true
