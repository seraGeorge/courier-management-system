services:
  collection_db:
    image: postgres:16
    container_name: collection-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: collection_db
    ports:
      - "5432:5432"
    volumes:
      - courier_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - logistics_network

  collection_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: collection_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    depends_on:
      collection_db:
        condition: service_healthy
    networks:
      - logistics_network

  collection_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000/api
    container_name: collection_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - collection_backend
    networks:
      - logistics_network

volumes:
  courier_db_data:

networks:
  logistics_network:
    external: true